name = "bugdrop"
main = "src/index.ts"
compatibility_date = "2024-01-29"
workers_dev = true

routes = [
  { pattern = "bugdrop.dev/board*", zone_name = "bugdrop.dev" },
  { pattern = "bugdrop.dev/board-dogfood*", zone_name = "bugdrop.dev" },
  { pattern = "bugdrop.dev/api/bugdrop-board-token*", zone_name = "bugdrop.dev" },
]

# Static assets directory (for widget.js)
[assets]
directory = "public"
binding = "ASSETS"

# Environment variables
[vars]
ENVIRONMENT = "development"
ALLOWED_ORIGINS = "*"  # "*" for dev, comma-separated URLs for production
CLICKUP_LIST_ID = "" # Destination ClickUp List ID
MAX_SCREENSHOT_SIZE_MB = "5"  # Maximum screenshot size in MB
BUGDROP_BOARD_TENANT_ID = "tenant_mean_weasel"
BUGDROP_BOARD_APP_ID = "app_mean_weasel_bugdrop_dogfood"

# Self-hosted production deployment: `wrangler deploy --env production`
# ALLOWED_ORIGINS and CLICKUP_LIST_ID are set as secrets (not committed here) to
# avoid publishing internal domain names / IDs in this public repo:
#   wrangler secret put ALLOWED_ORIGINS --env production
#   wrangler secret put CLICKUP_LIST_ID --env production
[env.production]
name = "bugdrop"
workers_dev = true
routes = []

[env.production.vars]
ENVIRONMENT = "production"
MAX_SCREENSHOT_SIZE_MB = "5"

# Rate limiting KV namespace
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "e6454ed79f514ed3a9e24eea99dd6cd3"
preview_id = "ff8f3809037d4403befd09369a9f7e36"

# Secrets (set with: wrangler secret put CLICKUP_API_TOKEN)
# CLICKUP_API_TOKEN
# AUTH_TOKEN_SECRET  # Optional: set to require signed host-app auth tokens for /feedback
# BUGDROP_BOARD_TOKEN_SECRET  # Optional: enables /board embedded demo token signing

# Preview environment for live E2E tests (deployed in merge queue)
[env.preview]
name = "bugdrop-preview"
workers_dev = true
routes = []

[env.preview.vars]
ENVIRONMENT = "preview"
ALLOWED_ORIGINS = "*"
CLICKUP_LIST_ID = ""
MAX_SCREENSHOT_SIZE_MB = "5"

[[env.preview.kv_namespaces]]
binding = "RATE_LIMIT"
id = "cdb88fa95d6348d6ab84037751853d5d"
